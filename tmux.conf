# ═══════════════════════════════════════════════════════════════════════════
#  tmux.conf — leader Ctrl+Space, optimisé Claude Code
#  tmux >= 3.8 requis
#  Recharger :  prefix + r      Éditer :  prefix + e
# ═══════════════════════════════════════════════════════════════════════════

# ── Palette (Solarized Dark) ───────────────────────────────────────────────
# Change ces 12 lignes pour reskinner toute la barre de statut.
%hidden BG="#002b36"
%hidden BG_ALT="#002b36"   # = fond du terminal : la barre se fond avec le bord bas
%hidden SURFACE="#073642"
%hidden MUTED="#586e75"
%hidden FG="#93a1a1"
%hidden FG_DIM="#839496"
%hidden BLUE="#268bd2"
%hidden LAVENDER="#6c71c4"
%hidden MAUVE="#d33682"
%hidden GREEN="#859900"
%hidden PEACH="#cb4b16"
%hidden YELLOW="#b58900"
%hidden RED="#dc322f"


# ═══ 1. LEADER : Ctrl+Space ════════════════════════════════════════════════

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix        # prefix + C-Space → envoie un vrai C-Space
bind Tab last-window
bind C-o switch-client -l       # dernière session


# ═══ 2. TERMINAL & COULEURS ════════════════════════════════════════════════

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true color (gnome-terminal/VTE)
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"            # undercurl + couleur (LSP diagnostics)
set -as terminal-features ",*:hyperlinks"         # OSC 8 : liens cliquables
set -s theme terminal           # popups, menus, recherche : couleurs ANSI du terminal

# Laisse passer les séquences brutes vers le terminal hôte :
# images (kitty/sixel), OSC 52, notifications, progress bars.
set -g allow-passthrough on

# Touches étendues (CSI u) : permet à Claude Code de distinguer
# Shift+Enter, Ctrl+Enter, Alt+Enter → retour à la ligne sans envoyer.
set -s extended-keys on
set -as terminal-features ",*:extkeys"


# ═══ 3. SPÉCIFIQUE CLAUDE CODE ═════════════════════════════════════════════

# CRITIQUE : Échap sert à interrompre Claude. Le délai tmux par défaut
# (500 ms) rend la touche molle et mange les Échap rapides.
set -s escape-time 0

# Claude crache beaucoup de sortie : on garde de quoi remonter loin.
set -g history-limit 200000

# Presse-papier système via OSC 52 → fonctionne aussi à travers SSH.
set -g set-clipboard on

# Claude sonne la cloche quand il a fini / attend une réponse.
# La fenêtre concernée s'allume en jaune dans la barre de statut.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set -g monitor-activity on      # point sur les fenêtres non lues…
set -g activity-action none     # … sans bip ni message
bind -n M-b next-window -a      # Alt+b → saute à la prochaine fenêtre qui sonne

set -g focus-events on          # nvim/Claude savent quand le pane perd le focus

# Si une commande échoue, le pane reste ouvert avec l'erreur à l'écran au lieu
# de disparaître aussitôt. Indispensable pour diagnostiquer les binds ci-dessous.
#   prefix + x     ferme le pane mort
#   prefix + M-r   relance la commande dans le pane
set -g remain-on-exit failed
bind M-r respawn-pane -k

# Lancer Claude (le pane se ferme à la sortie, quel que soit le code retour)
bind a new-window  -c "#{pane_current_path}" -n claude "claude" \; set -p remain-on-exit off
bind A split-window -h -l 45% -c "#{pane_current_path}" "claude" \; set -p remain-on-exit off
# prefix + C-a : session "claude" flottante, persistante, toggle
bind C-a if -F '#{==:#{session_name},claude-popup}' { detach-client } \
    { if-shell "tmux list-clients -F '##{client_session}' | grep -qx claude-popup" \
        { detach-client -s claude-popup } \
        { display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 85% -E \
            "tmux new-session -d -s claude-popup 2>/dev/null; tmux set -t claude-popup detach-on-destroy on; tmux set -wt claude-popup remain-on-exit off; exec tmux attach -t claude-popup" } }


# ═══ 4. CONFORT GÉNÉRAL ════════════════════════════════════════════════════

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g pane-scrollbars modal    # barre de défilement en mode copie uniquement
set -g detach-on-destroy off    # session tuée → bascule ailleurs, pas de detach
set -g display-time 2000
set -g display-panes-time 2000
set -g status-interval 5
set -g repeat-time 500
setw -g mode-keys vi
set -g status-keys emacs        # édition à la emacs dans le prompt tmux
setw -g aggressive-resize on
set -g word-separators " @\"=()[]{}',;:|"

# Titres de fenêtre : nom du dossier, et les apps ne peuvent pas l'écraser.
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#S ▸ #W'


# ═══ 5. RACCOURCIS ═════════════════════════════════════════════════════════

bind r source-file ~/.tmux.conf \; display -d 1500 " config rechargée"
bind e display-popup -w 85% -h 85% -E '${EDITOR:-vim} ~/.tmux.conf'

# — Splits & fenêtres (toujours dans le dossier courant) —
bind | split-window -h  -c "#{pane_current_path}"
bind - split-window -v  -c "#{pane_current_path}"
bind '\' split-window -fh -c "#{pane_current_path}"   # split pleine hauteur
bind _ split-window -fv  -c "#{pane_current_path}"    # split pleine largeur
bind c new-window        -c "#{pane_current_path}"
unbind '"'
unbind %

bind x kill-pane                # sans confirmation
bind X kill-window
bind Q confirm-before -p "tuer la session #S ? (y/n)" kill-session

# — Navigation entre panes : Alt+hjkl, sans prefix —
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# — Redimensionner : prefix + HJKL (répétable) —
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# — Fenêtres : Shift+flèches (sans prefix), Ctrl+Shift pour déplacer —
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -r C-S-Left  swap-window -t -1 \; previous-window
bind -r C-S-Right swap-window -t +1 \; next-window

# — Panes : déplacer / extraire / rapatrier —
bind > swap-pane -D
bind < swap-pane -U
bind b break-pane -t : \; display " pane extrait"
bind @ choose-window "join-pane -h -s '%%'"
bind Space next-layout
bind = select-layout tiled
bind S set-window-option synchronize-panes \; \
       display "sync-panes #{?pane_synchronized,ON,OFF}"
bind m set -g mouse \; display "souris #{?mouse,ON,OFF}"

# — Sessions —
bind s choose-tree -Zs
bind w choose-tree -Zw
bind N command-prompt -p "nouvelle session:" "new-session -A -s '%%'"
bind R command-prompt -I "#S" -p "renommer session:" "rename-session '%%'"

# fzf : binaire système si présent, sinon l'installation git dans ~/.fzf
# (~/.fzf/bin n'est pas dans le PATH, d'où le chemin absolu)
if-shell 'command -v fzf >/dev/null' \
  'set -g @fzf "fzf"' \
  'set -g @fzf "$HOME/.fzf/bin/fzf"'

# prefix + C-f : bascule de session en popup fzf (la commande d'une popup n'est pas un format)
bind C-f display-popup -w 50% -h 50% -E \
  "tmux list-sessions -F '#{?session_attached,,#{session_name}}' \
   | grep -v '^$' \
   | \"\$(tmux show -gv @fzf)\" --reverse --prompt 'session> ' --height=100% \
   | xargs -r tmux switch-client -t"

# prefix + f : dépôt ou worktree en popup fzf → fenêtre déjà ouverte dessus, sinon nouvelle
# Dossiers parcourus, séparés par des espaces (chemins sans espace)
set -g @project-dirs "$HOME/Projects $HOME/src $HOME/code"
bind f display-popup -w 60% -h 60% -E "$HOME/.local/bin/tmux-project"

# prefix + C-n : liste des notifications système, puis marque comme lu
bind C-n display-popup -w 85% -h 85% -E "$HOME/.local/bin/tmux-notify show"
bind M-n run-shell "$HOME/.local/bin/tmux-notify clear"

# Terminal scratch flottant (Alt+g) : toggle détache (session conservée), exit tue
bind -n M-g if -F '#{==:#{session_name},scratch}' { detach-client } \
    { if-shell "tmux list-clients -F '##{client_session}' | grep -qx scratch" \
        { detach-client -s scratch } \
        { display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
            "tmux new-session -d -s scratch 2>/dev/null; tmux set -t scratch detach-on-destroy on; tmux set -wt scratch remain-on-exit off; exec tmux attach -t scratch" } }

# Git en popup (tig si présent, sinon historique ; q pour fermer)
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E \
    "command -v tig >/dev/null && git rev-parse --git-dir >/dev/null 2>&1 && exec tig; { git rev-parse --git-dir >/dev/null 2>&1 && git -c color.ui=always log --graph --oneline --decorate || git status; } 2>&1 | less -R"

# Lister les URLs visibles dans le pane (chargées dans un buffer pour coller)
bind u capture-pane -J -b urltmp -S -3000 \; display-popup -w 80% -h 60% -E \
    "u=\$(tmux show-buffer -b urltmp | grep -oE 'https?://[^ \"'\\''>）)]+' | sort -u); \
     tmux delete-buffer -b urltmp; [ -n \"\$u\" ] || exit; \
     printf '%s\\n' \"\$u\" | tmux load-buffer -; printf '%s\\n' \"\$u\" | less -R"


# ═══ 6. COPIER / COLLER ════════════════════════════════════════════════════

# Choix de l'outil système : Wayland → X11 → OSC 52 seul.
if -F '#{==:#{@copy_cmd},}' \
  'if-shell "command -v wl-copy >/dev/null" \
      "set -g @copy_cmd \"wl-copy\"" \
      "if-shell \"command -v xclip >/dev/null\" \
          \"set -g @copy_cmd \\\"xclip -selection clipboard -i\\\"\" \
          \"set -g @copy_cmd cat\""'

bind Enter copy-mode
bind -n M-Up copy-mode
bind / copy-mode \; command-prompt -i -T search -p "recherche:" { send -X search-backward-incremental "%%" }
bind p paste-buffer -p
bind P choose-buffer -Z

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi Y      send -X copy-pipe-end-of-line-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# Souris : glisser = copier sans sauter en bas ; double/triple clic = mot/ligne
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "#{@copy_cmd}"
bind -T copy-mode-vi DoubleClick1Pane  send -X select-word \; \
                                       send -X copy-pipe-no-clear "#{@copy_cmd}"
bind -T copy-mode-vi TripleClick1Pane  send -X select-line \; \
                                       send -X copy-pipe-no-clear "#{@copy_cmd}"
# Double/triple clic hors copy-mode : les binds natifs ne copient qu'en OSC 52, on passe par @copy_cmd
bind -n DoubleClick1Pane select-pane -t = \; \
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } \
       { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel "#{@copy_cmd}" }
bind -n TripleClick1Pane select-pane -t = \; \
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } \
       { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel "#{@copy_cmd}" }
bind -T copy-mode-vi WheelUpPane   send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down


# ═══ 7. TMUX IMBRIQUÉ (SSH) — F12 pour basculer ════════════════════════════
# Grise la barre et coupe les raccourcis locaux : tout part au tmux distant.

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$MUTED,bg=$BG_ALT" \;\
    set window-status-current-format "#[fg=$MUTED,bg=$SURFACE] #I #W " \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S
bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-format \;\
    refresh-client -S


# ═══ 8. BORDURES & BARRE DE STATUT ═════════════════════════════════════════

set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=$SURFACE"
set -g pane-active-border-style "fg=$BLUE"
set -g display-panes-colour "$MUTED"
set -g display-panes-active-colour "$BLUE"

# Titre de pane affiché seulement quand il y en a plusieurs
set -g pane-border-status off
set -g pane-border-format " #{pane_index}#{?pane_title,: #{pane_title},} "
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

set -g message-style "fg=$BG,bg=$PEACH,bold"
set -g message-command-style "fg=$FG,bg=$SURFACE"
set -g mode-style "fg=$BG,bg=$LAVENDER,bold"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=$FG_DIM,bg=$BG_ALT"
set -g status-left-length 40
set -g status-right-length 120

# Gauche : pastille session — bleue au repos, rose quand le prefix est armé,
# orange en mode copie, verte quand les panes sont synchronisés.
set -g status-left \
"#[fg=$BG,bg=#{?client_prefix,$RED,#{?pane_in_mode,$PEACH,#{?pane_synchronized,$GREEN,$BLUE}}},bold] #S #[default] "

# Droite : notifications système · branche git · dossier · heure
set -g status-right \
"#($HOME/.local/bin/tmux-notify count)\
#[fg=$MAUVE,bg=$BG_ALT]#(cd '#{pane_current_path}' 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/ & /')\
#[fg=$FG_DIM,bg=$SURFACE] #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}} \
#[fg=$BG,bg=$LAVENDER,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-current-style default   # pas de soulignement implicite
# ● : sortie depuis la dernière visite (sauf btop, qui rafraîchit en continu)
set -g window-status-format \
"#[fg=$MUTED,bg=$BG_ALT]  #I #W#{?#{&&:#{window_activity_flag},#{!=:#{pane_current_command},btop}}, ●,}#{?window_zoomed_flag, ⛶,} "
set -g window-status-current-format \
"#[fg=$BG,bg=$LAVENDER,bold]  #I #W#{?window_zoomed_flag, ⛶,} "
# Fenêtre qui a sonné (Claude a fini / attend) → pastille jaune
set -g window-status-bell-style "fg=$BG,bg=$YELLOW,bold"
set -g window-status-activity-style default   # le point suffit


# ═══ 9. PLUGINS (TPM) — optionnels ═════════════════════════════════════════
# Installer :  git clone https://github.com/tmux-plugins/tpm \
#                  ~/.tmux/plugins/tpm
# Puis dans tmux : prefix + I (installer) · prefix + U (mettre à jour)
# Sans TPM installé, tout ce bloc est simplement ignoré.

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix+C-s sauver / C-r restaurer
set -g @plugin 'tmux-plugins/tmux-continuum'    # sauvegarde auto

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btop "claude->claude --resume"'   # claude rouvre le choix de conversation
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'   # mets 'on' pour restaurer au démarrage

# Réglages propres à la machine (shell, @project-dirs…), hors dépôt
source-file -q ~/.tmux.local.conf

if -b '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
     'run -b "$HOME/.tmux/plugins/tpm/tpm"'
